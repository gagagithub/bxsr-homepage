<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  /* 养老日报 2350×1000 横版首屏封面(公众号头条完整展示 2.35:1)。
     象牙金报刊风, 与 pension.html 正文/财经日报同一视觉家族。
     转发到聊天会裁中央方形 → 大字水平居中, 关键信息都落在中央 1000px 安全区内。 */
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  :root{ --ink:#222019; --sub:#8a8275; --gold:#9c7b2e; --red:#b23b2e; --warm:#b9791b; --paper:#faf7ef; }
  html,body{ width:2350px; height:1000px; overflow:hidden;
    font-family:"Noto Sans CJK SC","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; }
  .stage{ position:relative; width:2350px; height:1000px; background:var(--paper); overflow:hidden; }
  /* 纸面质感: 极淡的米金渐晕 + 细点 */
  .stage::before{ content:""; position:absolute; inset:0;
    background:radial-gradient(ellipse 70% 90% at 50% 30%, rgba(185,121,27,.07), transparent 70%); }
  .dots{ position:absolute; inset:0; opacity:.35;
    background-image:radial-gradient(rgba(156,123,46,.18) 1.5px, transparent 2.5px); background-size:44px 44px; }
  /* 报刊双线边框 */
  .frame{ position:absolute; inset:34px; border:3px solid var(--gold); }
  .frame::after{ content:""; position:absolute; inset:10px; border:1px solid rgba(156,123,46,.55); }

  /* 报头 */
  .mast{ position:absolute; top:78px; left:0; right:0; text-align:center; }
  .kicker{ display:inline-flex; align-items:center; gap:26px; }
  .kicker .rule{ width:170px; height:2px; background:linear-gradient(90deg, transparent, var(--gold)); }
  .kicker .rule.r{ background:linear-gradient(90deg, var(--gold), transparent); }
  .kicker .bn{ font-size:46px; font-weight:800; letter-spacing:14px; color:var(--gold); text-indent:14px; }
  .brand{ margin-top:18px; font-size:88px; font-weight:900; letter-spacing:22px; color:var(--ink); text-indent:22px; }
  .datep{ margin-top:16px; font-size:32px; color:var(--sub); letter-spacing:6px; }

  /* 中央大字钩子(flex 垂直居中: 1 行/2 行标题都不会压到页脚) */
  .hook{ position:absolute; top:300px; bottom:190px; left:120px; right:120px; text-align:center;
    display:flex; flex-direction:column; justify-content:center; }
  .h1line{ font-weight:900; color:var(--ink); line-height:1.22; letter-spacing:4px; font-size:158px; }
  .h1line.small{ font-size:126px; }        /* 超 12 字的行自动降号 */
  .h1line .num{ color:var(--red); }
  .hooksub{ margin-top:44px; font-size:42px; color:#6d6557; letter-spacing:2px; font-weight:600; }

  /* 页脚 */
  .foot{ position:absolute; left:120px; right:120px; bottom:74px; display:flex; align-items:center; }
  .foot .sl{ font-size:30px; color:var(--sub); letter-spacing:5px; }
  .foot .cta{ margin-left:auto; font-size:31px; font-weight:800; color:#fff; background:var(--warm);
    padding:16px 38px; border-radius:40px; letter-spacing:3px; }

  /* 右上角金印(报刊藏书印, 落在裁方区外, 裁掉不影响信息) */
  .seal{ position:absolute; top:96px; right:110px; width:118px; height:118px; border:4px solid var(--red);
    border-radius:14px; display:flex; align-items:center; justify-content:center; opacity:.85; transform:rotate(4deg); }
  /* 印文 2×2 直排(右列先读: 老有/所养), 别用 <br>+vertical-rl(实测串位) */
  .seal span{ font-size:40px; font-weight:900; color:var(--red); letter-spacing:6px;
    line-height:1.2; writing-mode:vertical-rl; height:100px; }
</style>
</head>
<body>
<div class="stage">
  <div class="dots"></div>
  <div class="frame"></div>

  <div class="mast">
    <div class="kicker"><span class="rule"></span><span class="bn">崔伟说养老 · 养老日报</span><span class="rule r"></span></div>
    <div class="datep">2026年8月12日 · 周三 · 讲您养老账本上的钱</div>
  </div>

  <div class="hook">
    
    <div class="h1line">领城乡居民养老金的注意</div>
    
    <div class="h1line">每月又涨了<span class="num">20</span>元</div>
    
    <div class="hooksub">城乡居民基础养老金又上调了。自今年1月1日起</div>
  </div>

  <div class="seal"><span>老有所养</span></div>

  <div class="foot">
    <div class="sl">崔伟说养老 · 让天下人老有所养</div>
    <div class="cta">点开看完整内容 ›</div>
  </div>
</div>
</body>
</html>
