name: 规划师聊天复盘 - 每日 12:00 (DeepSeek 分析)

# 2026-09-21 崔伟拍板: 规划师想当天看到自己所有客户聊天里哪里做得不好 → 逐客户复盘。
# ⭐9-28 起按工作日切: 范围=上一个工作日 0 点→今天 0 点(含中间休息日), 休息日不出, 见 review.py 开头。
# ⭐2026-10-11 崔伟定: Claude(订阅/CLI) 换 DeepSeek V4.1-Flash(deepseek-flash, API, 支持看图), 不再依赖 Claude Code。
# 流程: 生产逐天导出 1 对 1 聊天(已脱敏: 不带客户名、手机号/证件号打码)
#       → DeepSeek 每人一份复盘(只从成交角度, 聊天图片按编号附在消息里) , 发本人; 崔伟只收一条全员完整复盘链接
#       → 回传生产 /chatReview/upload → 生产替换回客户昵称、存完整页、夏梅推送。
# ⚠定时不走 GitHub schedule(白天排队延迟 1~3.5 小时), 由生产服务器计划任务
#   ChatReviewDispatch(每天北京 12:00, 9-21 崔伟定)准点 workflow_dispatch 触发。
#   ⚠别加 schedule, 否则一天双跑、规划师收两条。
# ⛔本仓库是 PUBLIC: Actions 日志人人可看 → 脚本只打印条数/耗时, 绝不打印聊天或分析内容, 也不传 artifact。
# 手动: gh workflow run planner-chat-review.yml -f mode=run -f test_vxid=CuiWei   (只发崔伟一人)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'run=正式 / ping=只测 DeepSeek key 通不通'
        required: false
        default: 'run'
      test_vxid:
        description: '填企微 userid 则所有消息只发给这一个人(联调用), 留空=正式发'
        required: false
        default: ''
      only:
        description: '只分析这些规划师 vx_id(逗号分隔), 留空=全部'
        required: false
        default: ''
      end:
        description: '出复盘的那一天 yyyy-MM-dd(补跑用), 留空=今天; 范围=上一个工作日+其后休息日'
        required: false
        default: ''
      force:
        description: 'true=今天已推过也照发(同日补跑用)'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: planner-chat-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -q requests pillow

      - name: Review
        working-directory: scripts/chat-review
        env:
          # 2026-10-11 起走 DeepSeek API(和财经日报/选题池同一个 key, 按量付费)
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CHAT_REVIEW_TOKEN: ${{ secrets.CHAT_REVIEW_TOKEN }}
          MODE: ${{ inputs.mode || 'run' }}
          TEST_VXID: ${{ inputs.test_vxid }}
          ONLY: ${{ inputs.only }}
          WINDOW_END: ${{ inputs.end }}
          FORCE: ${{ inputs.force }}
        run: python -u review.py

      # 9-30 崔伟: 没回提醒里规划师点了「这条不用回」的, AI 抽查哪些点错了(其实该回), 只发崔伟异常的, 都正常不发。
      # 复盘失败也照跑(always); 只分析部分规划师(only)或 ping 时不跑。
      - name: 「不用回」点错抽查
        if: always() && (inputs.mode || 'run') == 'run' && inputs.only == ''
        working-directory: scripts/chat-review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CHAT_REVIEW_TOKEN: ${{ secrets.CHAT_REVIEW_TOKEN }}
          TEST_VXID: ${{ inputs.test_vxid }}
          WINDOW_END: ${{ inputs.end }}
          FORCE: ${{ inputs.force }}
        run: python -u skip_review.py
