name: 财经日报 - 每日生成 + 推送规划师朋友圈

on:
  schedule:
    # ⚠2026-08-04 崔伟拍板: 北京 16:05 → **北京 14:00** (UTC 06:00)。
    #   原因=GitHub schedule 白天排队延迟实测越来越大(8-01 拖到 18:06 / 8-02 18:04 / 8-03 19:36,
    #   延迟 2~3.5 小时), 按 16:05 排已经赶不上编辑 18:00 前后发放。提前到 14:00 起排,
    #   即便再拖 3.5 小时也在 17:30 前就绪。代价=A股(15:00)当天收盘数据取不到当日收盘价,
    #   行情块拿到的是盘中/前一交易日值 —— 崔伟已知悉并接受(时效优先)。
    # 全流程约 8-15 分钟(取数 2 + AI 整理 3-8 + 渲染截图 1 + 上传)。
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chinese fonts (CJK for cover image)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra

      - name: Install Python dependencies
        run: pip install -r scripts/morning-report/requirements.txt

      - name: Fetch market data (akshare 行情, 复用 market-express)
        working-directory: scripts/market-express
        run: |
          python -u fetch_cn.py || echo "⚠ 行情取数部分失败, 日报行情板块按缺省渲染"
          cp -f data.json ../morning-report/data.json || true

      - name: Fetch real news telegraph (东方财富快讯)
        working-directory: scripts/morning-report
        run: python -u fetch_news.py

      # 养老民生素材(联网检索): 东财电报出不来养老金/退休金/存款利率/大额存单这类内容,
      # 单独搜一轮并入新闻池。失败不阻塞日报(脚本内部自己写空 items 并 exit 0)。
      # ⚠ 2026-08-07 养老日报恢复为独立管线(daily-pension-report.yml, 北京12:00): 通常 12:00
      # 那条已检索并留底当天 pension_news.json, 这里脚本会检测到"今天已检索过"直接复用不重搜
      # (不复用的话, 12:00 的结果会被当成排除清单, 财经日报养老档当天素材凭空清零)。
      - name: Fetch 养老民生素材 (千问联网检索)
        continue-on-error: true
        working-directory: scripts/morning-report
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: python -u fetch_pension_news.py

      - name: AI organize into morning report (DeepSeek, 3-call)
        working-directory: scripts/morning-report
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -u llm_morning.py

      # ⚠ 2026-07-28 改下午发放时砍掉电台视频版(崔伟拍板): CI 渲染 9 分钟视频要 30-45 分钟,
      # 是 18:00 前交付的最大不确定项。radio/ 脚本与 Java 端 morningReportVideo* 端点全部保留,
      # 三端渲染本来就按"当天有没有 mp4"优雅降级, 不生成即自动回退纯图文。要恢复=把这几步加回来。

      - name: Render H5 + cover + moment text + 公众号图文 (pub_date = 北京当天)
        working-directory: scripts/morning-report
        run: |
          export MX_PUB_DATE="$(TZ='Asia/Shanghai' date +%Y-%m-%d)"
          python -u render_morning.py
          python -u render_wechat.py
          # ⚠ 2026-08-07 养老日报已恢复, 但走独立管线 daily-pension-report.yml(北京12:00),
          # 不在这条 workflow 里渲染(llm_morning 的 gen_pension()/PENSION_DAILY 开关是
          # 7-30 停做前的旧路径, 保留不用)。别在这里把 render_pension 加回来。

      - name: Screenshot cover image (headless Chrome)
        run: |
          google-chrome --headless=new --disable-gpu --hide-scrollbars \
            --window-size=900,1125 \
            --screenshot="$GITHUB_WORKSPACE/scripts/morning-report/cover.png" \
            "file://$GITHUB_WORKSPACE/scripts/morning-report/cover.html"
          ls -la "$GITHUB_WORKSPACE/scripts/morning-report/cover.png"

      - name: Screenshot 行情速览图 (headless Chrome, 高度随行数动态)
        working-directory: scripts/morning-report
        run: |
          if [ -f market.html ]; then
            MH=$(cat market_h.txt 2>/dev/null || echo 1200)
            google-chrome --headless=new --disable-gpu --hide-scrollbars \
              --window-size=1000,${MH} \
              --screenshot="$GITHUB_WORKSPACE/scripts/morning-report/market.png" \
              "file://$GITHUB_WORKSPACE/scripts/morning-report/market.html"
            ls -la market.png
          else
            echo "⚠ 无 market.html(行情取数失败), 跳过行情图, 公众号正文将不含行情图"
          fi

      - name: Commit HTML to repo (留底 + 历史)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          cp scripts/morning-report/morning-report.html morning-report.html
          # ⚠sections.json 在 scripts/morning-report/.gitignore 里, 不加 -f 这行是静默 no-op,
          # 导致出问题时事后无法复现当天内容(runner 用完即毁)。-f 强制留底。
          git add morning-report.html || true
          git add -f scripts/morning-report/sections.json scripts/morning-report/pension_news.json || true
          # (养老日报的 pension.* 留底在 daily-pension-report.yml 那条独立管线里做)
          git commit -m "财经日报 $(TZ='Asia/Shanghai' date +%Y-%m-%d)" || echo "无变更"
          git pull --rebase || true
          git push || echo "push 跳过"

      # ⚠2026-08-04 崔伟拍板**恢复全自动**: 上传即分发(推5规划师朋友圈 + 建公众号草稿)。
      #   (2026-07-31 曾改成"CI 只生成不外发、人工核稿后手动分发", 因连日没人核稿导致实际一天也没发出去。)
      #   全自动两个开关必须同时开, 缺一不发:
      #     ① 这里**不带** pushMoment=false (带了就不推朋友圈)
      #     ② 服务器 D:/morning-report/.draft-enabled 必须存在(改名成 .draft-enabled.off 就不建草稿)
      #   要再改回人工分发 = 加回 -F "pushMoment=false" + 服务器 ren .draft-enabled .draft-enabled.off,
      #   然后人工核稿后各打一条 curl(token 取自服务器 D:/morning-report/.token):
      #     建公众号草稿: curl -X POST https://214club.com.cn/creation/morningReportPushDraft  -d "token=<TOKEN>"
      #     推规划师朋友圈: curl -X POST https://214club.com.cn/creation/morningReportPushMoment -d "token=<TOKEN>"
      #   ⚠全自动下内容出问题(旧闻/幻觉)时朋友圈已发出去改不回, 只能重出公众号草稿 + H5。
      - name: Push to production (H5 + cover + moment文案 + 自动分发)
        env:
          MORNING_REPORT_TOKEN: ${{ secrets.MORNING_REPORT_TOKEN }}
        run: |
          if [ -z "${MORNING_REPORT_TOKEN}" ]; then
            echo "::error::缺少 secret MORNING_REPORT_TOKEN —— 在 GitHub 仓库 Settings → Secrets 添加后重试"
            exit 1
          fi
          cd "$GITHUB_WORKSPACE/scripts/morning-report"
          # 行情图存在才带上(行情取数失败时无 market.png, 正文则不含行情图)
          MARKET_ARG=()
          [ -f market.png ] && MARKET_ARG=(-F "marketImg=@market.png;type=image/png")
          # AI 爆款标题存在才带上(缺省服务端回退「财经日报 X月X日」)
          TITLE_ARG=()
          [ -f wechat_title.txt ] && TITLE_ARG=(-F "wechatTitle=<wechat_title.txt")
          # 视频版已停(见上), 保留空数组占位: 恢复视频只需把 radio 生成步骤和这两行加回来
          VIDEO_ARG=()
          RESP=$(curl -sS --max-time 600 \
            -F "token=${MORNING_REPORT_TOKEN}" \
            -F "html=@morning-report.html;type=text/html" \
            -F "cover=@cover.png;type=image/png" \
            -F "momentText=<moment_text.txt" \
            -F "wechatHtml=@wechat.html;type=text/html" \
            -F "wechatDigest=<wechat_digest.txt" \
            "${TITLE_ARG[@]}" \
            "${MARKET_ARG[@]}" \
            "${VIDEO_ARG[@]}" \
            https://214club.com.cn/creation/morningReportUpload)
          echo "server response: ${RESP}"
          echo "${RESP}" | grep -q '"code":0' || { echo "::error::上传失败(令牌或服务端异常)"; exit 1; }
          echo "✓ 今日财经日报已生成并存到生产(H5 可直接看)。⚠尚未对外分发 —— 人工核稿后再打 morningReportPushDraft / morningReportPushMoment"
